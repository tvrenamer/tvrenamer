plugins {
    id 'java'
    id 'application'
}

def osName = System.getProperty('os.name').toLowerCase()
def osArch = (System.getProperty('os.arch').toLowerCase() in ['aarch64', 'arm64'])
    ? 'aarch64' : 'x86_64'

def isMacOs = osName.contains('mac')
def isWindows = osName.contains('windows')

// SWT ships a separate native artifact per OS/architecture, so pick the one
// matching the machine we are building on.
def swtVersion = '3.130.0'
def swtArtifact = isMacOs ? "org.eclipse.swt.cocoa.macosx.${osArch}"
    : isWindows ? "org.eclipse.swt.win32.win32.${osArch}"
    : "org.eclipse.swt.gtk.linux.${osArch}"

// A build only ever contains one platform's native library, so the archive has
// to say which one. Without this every runner would upload the same file name.
def platformLabel = "${isMacOs ? 'macos' : isWindows ? 'windows' : 'linux'}-${osArch}"

// The running application reads its version back out of a resource file to
// check for updates, so that file is the single source of truth. Reuse it here
// so the archives carry the same number. -PappVersion overrides it, which
// exists only so the release workflow can exercise the bundle and signing path
// on demand, without cutting a tag. Never pass it for a real release.
version = findProperty('appVersion') ?: file('src/main/resources/tvrenamer.version').text.trim()

// Build with whatever JDK runs Gradle, targeting 21. A toolchain would pin the
// build to an exactly-21 install, so a machine with only a newer JDK could not
// build at all.
def javaRelease = 21

application {
    mainClass = 'org.tvrenamer.controller.Launcher'

    // XStream reflects over UserPreferences, and its deprecated
    // java.util.Observable superclass has private fields that java.base does
    // not open. XStream makes every field accessible before it consults the
    // omitField calls in UserPreferencesPersistence, so without this, saving
    // preferences fails with "No converter available" on any JDK 17 or later.
    // Written as one token because jpackage passes each --java-options value
    // through as a single argument.
    applicationDefaultJvmArgs = ['--add-opens=java.base/java.util=ALL-UNNAMED']

    // SWT on macOS must run its event loop on the first thread.
    if (isMacOs) {
        applicationDefaultJvmArgs += '-XstartOnFirstThread'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.eclipse.platform:${swtArtifact}:${swtVersion}") {
        // The SWT host bundle declares a dependency on an unresolvable
        // ${osgi.platform} placeholder artifact.
        exclude group: 'org.eclipse.platform', module: 'org.eclipse.swt.${osgi.platform}'
    }
    implementation 'com.thoughtworks.xstream:xstream:1.4.21'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
}

gradle.taskGraph.whenReady {
    def current = JavaVersion.current()
    if (current < JavaVersion.toVersion(javaRelease)) {
        throw new GradleException("TVRenamer needs JDK ${javaRelease} or later to build, "
                                  + "but Gradle is running on ${current}.")
    }
}

tasks.named('test') {
    // The same arguments the start scripts and the native bundle use. The
    // tests read the real preferences file, so they need the java.util opens
    // just as much as the application does.
    jvmArgs application.applicationDefaultJvmArgs
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

tasks.named('distZip') {
    archiveFileName = "TVRenamer-${project.version}-${platformLabel}.zip"
}

// --- Native bundles --------------------------------------------------------
//
// jpackage always copies a runtime into the bundle, so these tasks build a
// trimmed one with jlink rather than shipping a whole JDK. Only final releases
// get bundles: jpackage rejects any version that is not purely numeric, and the
// zip keeps shipping on every platform either way.

// jdeps reports only java.base, java.desktop, java.sql and jdk.unsupported.
// Everything below that is here because something loads it reflectively or
// reads it as data, so jdeps cannot see it. Do not tidy any of these away.
//
//   jdk.crypto.ec    without it the HTTPS handshake to tvmaze.com fails, so
//                    the app starts but cannot look up a single episode. Check
//                    it still exists whenever the toolchain moves past 21.
//   java.logging     loaded reflectively.
//   jdk.localedata   java.base carries CLDR root and en only. Without this a
//                    German user gets 'Mar' instead of 'Marz' from the
//                    DateTimeFormatter in FileEpisode.formatDate, which writes
//                    the wrong month into the renamed file. It also changes
//                    Collator.getInstance in ResultsTable and the
//                    NumberFormat.getPercentInstance in FileMonitor. Measured:
//                    Locale.getAvailableLocales() drops from 1069 to 5.
//   jdk.charsets     sun.jnu.encoding is MS932 on a Japanese Windows install
//                    and GBK on a Chinese one. Neither is in java.base, and
//                    filenames are decoded with it.
def runtimeModules = ['java.base',
                      'java.desktop',
                      'java.logging',
                      'java.sql',
                      'jdk.unsupported',
                      'jdk.crypto.ec',
                      'jdk.localedata',
                      'jdk.charsets']

// Generated once. Changing it makes Windows install the new version alongside
// the old one instead of upgrading it.
def winUpgradeUuid = 'f4b7f32a-b131-482e-bec6-ef0f1e30881e'

def jdkHome = System.getProperty('java.home')
def runtimeImageDir = layout.buildDirectory.dir('jpackage-runtime')
def bundleDir = layout.buildDirectory.dir('jpackage')

tasks.register('trimmedRuntime', Exec) {
    group = 'distribution'
    description = 'Builds the minimal Java runtime that the native bundles carry.'

    outputs.dir(runtimeImageDir)

    // jlink refuses to write into a directory that already exists.
    doFirst {
        delete runtimeImageDir
    }

    commandLine "${jdkHome}/bin/jlink",
                '--add-modules', runtimeModules.join(','),
                '--strip-debug',
                '--no-header-files',
                '--no-man-pages',
                '--compress=zip-9',
                '--output', runtimeImageDir.get().asFile.absolutePath
}

tasks.register('jpackageBundle', Exec) {
    group = 'distribution'
    description = 'Builds a double-clickable installer carrying a trimmed Java runtime.'

    dependsOn 'installDist', 'trimmedRuntime'
    onlyIf { isMacOs || isWindows }

    def bundleType = isMacOs ? 'dmg' : 'exe'
    def iconFile = file(isMacOs ? 'src/main/resources/icons/tvrenamer.icns'
                                : 'src/main/resources/icons/oldschool-tv-icon.ico')
    def signIdentity = findProperty('macSignIdentity') ?: System.getenv('MAC_SIGN_IDENTITY')

    // Built here rather than at configuration time so that a beta build, which
    // skips this task, does not fail the whole build on the version check.
    doFirst {
        // '1.0b5' and '1.0rc1' both have to be caught here. The release
        // workflow gates on 'b' alone, which would let a release candidate
        // through to jpackage and a much less obvious error.
        if (!(project.version.toString() ==~ /\d+(\.\d+){0,2}/)) {
            throw new GradleException(
                "jpackage only accepts a numeric version, but this build is "
                + "${project.version}. Native bundles are for final releases only.")
        }

        delete bundleDir

        def command = ["${jdkHome}/bin/jpackage",
                       '--name', 'TVRenamer',
                       '--app-version', project.version.toString(),
                       '--input', layout.buildDirectory.dir('install/tvrenamer/lib')
                                        .get().asFile.absolutePath,
                       '--main-jar', tasks.jar.archiveFileName.get(),
                       '--main-class', application.mainClass.get(),
                       '--runtime-image', runtimeImageDir.get().asFile.absolutePath,
                       '--icon', iconFile.absolutePath,
                       '--type', bundleType,
                       '--dest', bundleDir.get().asFile.absolutePath]

        // Reuse the arguments the start scripts get, so -XstartOnFirstThread
        // stays declared once and cannot drift between the two.
        application.applicationDefaultJvmArgs.each { command += ['--java-options', it] }

        if (isMacOs) {
            command += ['--mac-package-identifier', 'org.tvrenamer.TVRenamer']
            // Absent a signing identity the bundle is unsigned, so a local
            // build needs no Apple setup and takes the same code path as CI.
            if (signIdentity) {
                command += ['--mac-sign',
                            '--mac-signing-key-user-name', signIdentity,
                            '--mac-entitlements', file('etc/entitlements.plist').absolutePath]
            }
        } else {
            command += ['--win-shortcut', '--win-menu', '--win-dir-chooser',
                        '--win-upgrade-uuid', winUpgradeUuid]
        }

        commandLine command
    }

    doLast {
        def built = bundleDir.get().file("TVRenamer-${project.version}.${bundleType}").asFile
        if (!built.exists()) {
            throw new GradleException("jpackage reported success but ${built} is missing.")
        }
        // jpackage names the file from --name and --app-version, so both macOS
        // runners produce the same one. The release job merges every artifact
        // into a single directory, where one architecture would silently
        // overwrite the other. Rename the file only, never --name, which sets
        // the .app bundle name and the menu bar title.
        def renamed = bundleDir.get()
                               .file("TVRenamer-${project.version}-${platformLabel}.${bundleType}")
                               .asFile
        delete renamed
        if (!built.renameTo(renamed)) {
            throw new GradleException("Could not rename ${built} to ${renamed}.")
        }
    }
}

// jpackage signs the .app inside the dmg but leaves the dmg itself unsigned,
// and Gatekeeper assesses what the user actually downloads. Without this,
// `spctl --assess` on the dmg reports 'no usable signature' even though the app
// inside it comes back as Notarized Developer ID. Signing has to happen before
// notarisation, because stapling the ticket afterwards would not survive a
// later signature.
tasks.register('signDmg', Exec) {
    group = 'distribution'
    description = 'Signs the dmg wrapper, which jpackage leaves unsigned.'

    def signIdentity = findProperty('macSignIdentity') ?: System.getenv('MAC_SIGN_IDENTITY')

    // Gradle runs a finaliser even when the task it finalises fails, and a
    // failed jpackageBundle leaves no dmg behind. Without the exists() check
    // this task would then throw about a missing dmg, burying the jpackage
    // error that actually caused it under one that points at signing instead.
    // jpackageBundle's own doLast already fails if the dmg is missing after a
    // successful run, so this can only skip a build that has already failed.
    onlyIf {
        isMacOs && signIdentity && bundleDir.get()
                .file("TVRenamer-${project.version}-${platformLabel}.dmg").asFile.exists()
    }

    doFirst {
        def dmg = bundleDir.get()
                           .file("TVRenamer-${project.version}-${platformLabel}.dmg")
                           .asFile
        // --force so a rebuild over an existing dmg replaces the signature
        // rather than failing. --timestamp because notarisation rejects a
        // signature without a secure timestamp.
        commandLine 'codesign', '--sign', signIdentity, '--timestamp', '--force',
                    dmg.absolutePath
    }
}

// Attached as a finaliser rather than a separate call, so `gradlew
// jpackageBundle` in the release workflow keeps working unchanged.
tasks.named('jpackageBundle') { finalizedBy 'signDmg' }
